<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      margin: 0;
    }

    h3 {
      margin: 0 0 16px 0;
      font-size: 16px;
      font-weight: 600;
      color: #333;
    }

    .toggle-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .toggle-label {
      font-size: 14px;
      color: #555;
    }

    .toggle-switch {
      position: relative;
      width: 50px;
      height: 26px;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: .3s;
      border-radius: 26px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #4CAF50;
    }

    input:checked + .slider:before {
      transform: translateX(24px);
    }

    .status {
      font-size: 12px;
      color: #666;
      padding: 8px 12px;
      background: #f5f5f5;
      border-radius: 4px;
      margin-top: 12px;
    }

    .status.error {
      background: #fee;
      color: #c33;
    }

    .status.success {
      background: #efe;
      color: #3c3;
    }

    .server-status {
      margin-top: 12px;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 12px;
    }

    .server-status.online {
      background: #efe;
      color: #3c3;
    }

    .server-status.offline {
      background: #fee;
      color: #c33;
    }

    .server-status.checking {
      background: #fff8e0;
      color: #960;
    }
  </style>
</head>
<body>
  <h3>PII Sanitizer</h3>

  <div class="toggle-container">
    <span class="toggle-label">Sanitize PII</span>
    <label class="toggle-switch">
      <input type="checkbox" id="sanitizeToggle">
      <span class="slider"></span>
    </label>
  </div>

  <div id="serverStatus" class="server-status checking">Checking server...</div>
  <div id="statusMessage" class="status"></div>

  <script src="popup.js"></script>
</body>
</html>
